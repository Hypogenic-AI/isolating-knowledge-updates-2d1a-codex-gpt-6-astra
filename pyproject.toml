[project]
name = "research-workspace"
version = "0.1.0"
description = "Resources for isolated counterfactual arithmetic editing"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "peft>=0.21.2",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "scipy>=1.15.3",
    "torch==2.6.0",
    "transformers>=4.46,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
